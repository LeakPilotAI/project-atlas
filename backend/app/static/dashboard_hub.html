<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta http-equiv="Cache-Control" content="no-store"/>
<title>Project Atlas</title>
<style>
:root{color-scheme:dark;--bg:#08090b;--surface:#111318;--fg:#f4f1ea;--muted:#959ca8;--border:#282d35;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:Inter,"Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px var(--sans)}
.top{height:92px;border-bottom:1px solid var(--border);background:#0b0d11;padding:13px 20px;display:flex;flex-direction:column;justify-content:space-between}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-weight:800;font-size:18px}.sub{color:var(--muted);font-size:12px}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tab{border:1px solid var(--border);background:transparent;color:var(--muted);padding:8px 12px;border-radius:9px;cursor:pointer;font:700 11px var(--mono)}.tab.on{background:var(--surface);color:var(--fg);border-color:#414955}.pane{display:none;height:calc(100vh - 92px)}.pane.on{display:block}.frame{width:100%;height:100%;border:0;background:var(--bg)}.domain{font:700 10px var(--mono);letter-spacing:.1em;color:var(--muted)}
@media(max-width:700px){.top{height:116px;padding:10px 12px}.pane{height:calc(100vh - 116px)}.row{align-items:flex-start}.sub{display:none}}

/* ATLAS XENOFORM UI */
html,body{background:radial-gradient(ellipse at 12% 0%,rgba(0,255,195,.09),transparent 28%),radial-gradient(ellipse at 92% 18%,rgba(255,20,55,.08),transparent 24%),#020405!important;color:#eafff8}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-radial-gradient(ellipse at 80% 10%,rgba(78,255,213,.025) 0 1px,transparent 2px 19px);opacity:.5}.top,.hero,.panel,.card,.stat,.shell,.metric,.trade,.priority{border-color:#1c5147!important;box-shadow:inset 0 1px rgba(110,255,224,.05),0 18px 48px rgba(0,0,0,.38)!important}.tab.on,.nav button.on{color:#7dffe5!important;box-shadow:inset 0 0 18px rgba(65,255,205,.08)}

/* XENOFORM HUD PASS II */
body:after{content:"PROJECT ATLAS // XENOFORM RESEARCH SYSTEM";position:fixed;right:18px;bottom:10px;z-index:99;font:700 9px ui-monospace,monospace;letter-spacing:.18em;color:rgba(92,255,220,.25);pointer-events:none}.top{background:linear-gradient(180deg,rgba(4,12,11,.98),rgba(2,7,7,.96))!important;border-bottom:1px solid #22584e!important}.nav button{border-radius:16px 4px 16px 4px!important}.nav button.on{background:linear-gradient(135deg,rgba(71,13,23,.85),rgba(14,9,10,.94))!important;color:#ff7b8a!important;border-color:#7a2635!important;box-shadow:inset 0 0 18px rgba(255,40,65,.08),0 0 18px rgba(255,30,60,.05)!important}
</style>
</head>
<body>
<header class="top">
  <div class="row">
    <div><div class="brand">Project Atlas</div><div class="sub">Separated decision systems · manual execution · validation first</div></div>
    <div id="domain" class="domain">HYPERLIQUID_PERPS</div>
  </div>
  <nav class="tabs" aria-label="Atlas workspaces">
    <button class="tab on" data-pane="perps" data-domain="HYPERLIQUID_PERPS">Perp Day Trade</button>
    <button class="tab" data-pane="quality" data-domain="EQUITY_INVESTMENT">Quality Dips</button>
    <button class="tab" data-pane="legacy" data-domain="ORCHESTRATION / RESEARCH">Command Center</button>
  </nav>
</header>
<section id="pane-perps" class="pane on"><iframe class="frame" src="/dashboard/perps?embed=1" title="Hyperliquid Perp Day Trade"></iframe></section>
<section id="pane-quality" class="pane"><iframe class="frame" data-src="/api/investments/quality-dips/view" title="Quality Dips Investment Research"></iframe></section>
<section id="pane-legacy" class="pane"><iframe class="frame" data-src="/dashboard/legacy?embed=1" title="Legacy Atlas Command Center"></iframe></section>
<script>
const domain=document.getElementById('domain');
document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.pane').forEach(x=>x.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('pane-'+btn.dataset.pane).classList.add('on');
  const frame=document.querySelector('#pane-'+btn.dataset.pane+' iframe');
  if(!frame.getAttribute('src'))frame.src=frame.dataset.src;
  domain.textContent=btn.dataset.domain;
}));
</script>
</body>
</html>
