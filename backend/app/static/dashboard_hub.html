<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta http-equiv="Cache-Control" content="no-store"/>
<title>Project Atlas</title>
<style>
:root{color-scheme:dark;--bg:#08090b;--surface:#111318;--fg:#f4f1ea;--muted:#959ca8;--border:#282d35;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:Inter,"Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px var(--sans)}
.top{height:92px;border-bottom:1px solid var(--border);background:#0b0d11;padding:13px 20px;display:flex;flex-direction:column;justify-content:space-between}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-weight:800;font-size:18px}.sub{color:var(--muted);font-size:12px}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tab{border:1px solid var(--border);background:transparent;color:var(--muted);padding:8px 12px;border-radius:9px;cursor:pointer;font:700 11px var(--mono)}.tab.on{background:var(--surface);color:var(--fg);border-color:#414955}.pane{display:none;height:calc(100vh - 92px)}.pane.on{display:block}.frame{width:100%;height:100%;border:0;background:var(--bg)}.domain{font:700 10px var(--mono);letter-spacing:.1em;color:var(--muted)}
@media(max-width:700px){.top{height:116px;padding:10px 12px}.pane{height:calc(100vh - 116px)}.row{align-items:flex-start}.sub{display:none}}
</style>
</head>
<body>
<header class="top">
  <div class="row">
    <div><div class="brand">Project Atlas</div><div class="sub">Separated decision systems · manual execution · validation first</div></div>
    <div id="domain" class="domain">HYPERLIQUID_PERPS</div>
  </div>
  <nav class="tabs" aria-label="Atlas workspaces">
    <button class="tab on" data-pane="perps" data-domain="HYPERLIQUID_PERPS">Perp Day Trade</button>
    <button class="tab" data-pane="quality" data-domain="EQUITY_INVESTMENT">Quality Dips</button>
    <button class="tab" data-pane="legacy" data-domain="ORCHESTRATION / RESEARCH">Command Center / Paper</button>
  </nav>
</header>
<section id="pane-perps" class="pane on"><iframe class="frame" src="/dashboard/perps" title="Hyperliquid Perp Day Trade"></iframe></section>
<section id="pane-quality" class="pane"><iframe class="frame" src="/api/investments/quality-dips/view" title="Quality Dips Investment Research"></iframe></section>
<section id="pane-legacy" class="pane"><iframe class="frame" src="/dashboard/legacy" title="Legacy Atlas Command Center"></iframe></section>
<script>
const domain=document.getElementById('domain');
document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.pane').forEach(x=>x.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('pane-'+btn.dataset.pane).classList.add('on');
  domain.textContent=btn.dataset.domain;
}));
</script>
</body>
</html>
