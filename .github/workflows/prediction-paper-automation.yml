name: Prediction PAPER Automation Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  prediction-paper-automation:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install Atlas
        run: python -m pip install -e backend
      - name: Run Prediction PAPER automation regression
        run: >-
          python -m pytest -q
          tests/test_prediction_paper_automation.py
          tests/test_prediction_markets_phase1.py
          tests/test_future_overview_v4.py
          tests/test_dashboard_hub_v4.py
          tests/test_frontend_freeze_v4.py
